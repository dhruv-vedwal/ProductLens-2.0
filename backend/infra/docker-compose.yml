services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: productlens
      POSTGRES_USER: productlens
      POSTGRES_PASSWORD: productlens_dev_only
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U productlens -d productlens"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-06-29T01-20-47Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: productlens
      MINIO_ROOT_PASSWORD: productlens_dev_only
    ports: ["59000:9000", "59001:9001"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/ready || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  # This profile validates the same migration-first dependency contract used by
  # deployed API/worker processes. It intentionally does not run the product
  # application image, which is built and deployed by the hosting platform.
  dependencies-ready:
    image: postgres:16-alpine
    profiles: [validation]
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: ["sh", "-c", "echo dependencies-ready"]
