[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "productlens-generation-engine"
version = "0.1.0"
description = "ProductLens 2.0 reliability-first generation engine"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.12,<3",
  "structlog>=25.4,<26",
  "httpx>=0.28,<1",
  "playwright>=1.55,<2",
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.40,<1",
  "dramatiq[rabbitmq]>=1.17,<2",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.17,<2",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.11,<2"]
storage = ["boto3>=1.35,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: runs a real local browser against supplied fixtures"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# FastAPI declares dependency injection through these evaluated defaults.
# They are framework contracts rather than mutable application defaults.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = [
  "src/productlens/execution/state_diff.py",
  "src/productlens/execution/spatial_index.py",
  "src/productlens/planning/form_dependencies.py",
  "src/productlens/services/stage_contracts.py",
  "src/productlens/config/settings.py",
  "src/productlens/providers/interfaces.py",
  "src/productlens/services/knowledge.py",
  "src/productlens/quality/video.py",
  "src/productlens/quality/synchronization.py",
  "src/productlens/quality/coverage.py",
  "src/productlens/quality/story.py",
  "src/productlens/quality/consistency.py",
  "src/productlens/quality/multimodal.py",
  "src/productlens/quality/presentation.py",
  "src/productlens/presentation/director.py",
  "src/productlens/presentation/scenes.py",
  "src/productlens/presentation/journey.py",
  "src/productlens/auth/security.py",
  "src/productlens/credentials/service.py",
  "src/productlens/browser/screencast.py",
  "src/productlens/video/source_timing.py",
  "src/productlens/contracts/models.py",
  "src/productlens/workers/broker.py",
  "src/productlens/workers/local.py",
  "src/productlens/workers/tasks.py",
  "src/productlens/services/jobs.py",
  "src/productlens/services/render_stage.py",
  "src/productlens/persistence/repository.py",
]

[tool.hatch.build.targets.wheel]
packages = ["src/productlens"]
